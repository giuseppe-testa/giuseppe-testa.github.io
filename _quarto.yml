project:
  type: website
  pre-render: scripts/build-date.ts
  preview:
    port: 4200
  output-dir: _site
  # Cover images are referenced from listing templates: always copy them
  resources:
    - images/**
  # Pages to render (data/, templates/, scripts/ and _design/ are not pages)
  render:
    - index.md
    - cv.qmd
    - bookshelf.qmd
    - audioshelf.qmd
    - films.qmd
    - projects/**
    - blog/**

website:
  title: "Giuseppe Testa"
  description: "Senior Data Scientist: machine learning, forecasting and applied AI."
  site-url: "https://giuseppe-testa.github.io"
  repo-url: "https://github.com/giuseppe-testa/giuseppe-testa.github.io"
  navbar:
    left:
      - href: index.md
        text: Home
      - href: projects/index.qmd
        text: Projects
      - href: blog/index.qmd
        text: Blog
      - href: bookshelf.qmd
        text: Bookshelf
      - href: audioshelf.qmd
        text: Audioshelf
      - href: films.qmd
        text: Films & TV
      - href: cv.qmd
        text: CV
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/giuseppe1-testa
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/giuseppe-testa
        aria-label: GitHub
  page-footer:
    left: "© 2026 Giuseppe Testa"
    center: "Finally I did it. Thanks, Claudio."
    right: "last build: {{< var build_date >}}"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: true
    highlight-style: github
    code-copy: true
    code-overflow: wrap

execute:
  # Notebooks keep the outputs you saved locally; .qmd results are cached in _freeze/
  freeze: auto
